server:
  # HTTP-порт, на котором Spring Boot принимает запросы от ИИ и ручные запросы оборудования.
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:mixer-normalizer}

springdoc:
  swagger-ui:
    # Swagger UI помогает вручную посмотреть и дернуть входные endpoint-ы.
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}

outer-answer:
  # Базовый адрес внешнего сервиса операций; к нему код добавляет /flux, /scoop, /flux/{id} и т.п.
  url: ${OUTER_ANSWER_URL:}
  # Лимит защищает внешний сервис от слишком большого числа одновременных POST/PUT.
  max-concurrent: ${OUTER_ANSWER_MAX_CONCURRENT:5}
  acquire-timeout-seconds: ${OUTER_ANSWER_ACQUIRE_TIMEOUT_SECONDS:30}
  connect-timeout-millis: ${OUTER_ANSWER_CONNECT_TIMEOUT_MILLIS:10000}
  read-timeout-millis: ${OUTER_ANSWER_READ_TIMEOUT_MILLIS:30000}

normalizer:
  # Все входные даты приводятся к этой зоне до проверок и отправки наружу.
  fixed-zone: ${NORMALIZER_FIXED_ZONE:+07:00}
  # Если time_stamp пришел без Z или offset, считаем его временем этой зоны.
  default-input-zone: ${NORMALIZER_DEFAULT_INPUT_ZONE:+07:00}
  input-time-pattern: ${NORMALIZER_INPUT_TIME_PATTERN:yyyy-MM-dd_HH-mm-ss}
  input-offset-pattern: ${NORMALIZER_INPUT_OFFSET_PATTERN:XX}
  storage-time-pattern: ${NORMALIZER_STORAGE_TIME_PATTERN:yyyy-MM-dd_HH-mm-ss}
  outer-time-pattern: ${NORMALIZER_OUTER_TIME_PATTERN:yyyy-MM-dd_HH-mm-ssxx}

equipment:
  # Можно отключить проверки оборудования для локального отладочного запуска.
  check-enabled: ${EQUIPMENT_CHECK_ENABLED:true}
  # Дефолт нужен только до первого реального значения от polling или PUT /equipment/{mixer_id}.
  default-gate-open: ${EQUIPMENT_DEFAULT_GATE_OPEN:true}
  default-tilt: ${EQUIPMENT_DEFAULT_TILT:false}
  polling:
    # Фоновый опрос держит локальный кэш шторки и наклона свежим.
    enabled: ${EQUIPMENT_POLLING_ENABLED:true}
    # 120 секунд - это 2 минуты между завершением одного опроса и стартом следующего.
    interval-seconds: ${EQUIPMENT_POLLING_INTERVAL:120}
    url: ${EQUIPMENT_POLLING_URL:}
    connect-timeout-millis: ${EQUIPMENT_POLLING_CONNECT_TIMEOUT_MILLIS:10000}
    read-timeout-millis: ${EQUIPMENT_POLLING_READ_TIMEOUT_MILLIS:30000}
    legacy-gate-field: ${EQUIPMENT_POLLING_LEGACY_GATE_FIELD:gate}
    legacy-tilt-field: ${EQUIPMENT_POLLING_LEGACY_TILT_FIELD:tilt}
    legacy-gate-open-value: ${EQUIPMENT_POLLING_LEGACY_GATE_OPEN_VALUE:OPEN}
    legacy-tilt-true-values: ${EQUIPMENT_POLLING_LEGACY_TILT_TRUE_VALUES:true,1}

asutp:
  # Если true, polling берет состояние через цепочку url_1 -> url_2 -> url_3.
  enabled: ${ASUTP_ENABLED:true}
  url-1: ${ASUTP_URL_1:${URL_1:}}
  url-2: ${ASUTP_URL_2:${URL_2:}}
  url-3: ${ASUTP_URL_3:${URL_3:}}
  method-1: ${ASUTP_METHOD_1:POST}
  method-2: ${ASUTP_METHOD_2:POST}
  method-3: ${ASUTP_METHOD_3:POST}
  domain-name: ${ASUTP_DOMAIN_NAME:${DOMAIN_NAME:}}
  password: ${ASUTP_PASSWORD:${PASSWORD:}}
  cast-house-id: ${ASUTP_CAST_HOUSE_ID:${CAST_HOUSE_ID:${ASUTP_LAST_HOUSE_ID:${LAST_HOUSE_ID:}}}}
  domain-name-field: ${ASUTP_DOMAIN_NAME_FIELD:domainName}
  password-field: ${ASUTP_PASSWORD_FIELD:password}
  cast-house-id-field: ${ASUTP_CAST_HOUSE_ID_FIELD:castHouseId}
  auth-body: ${ASUTP_AUTH_BODY:}
  context-body: ${ASUTP_CONTEXT_BODY:}
  data-body: ${ASUTP_DATA_BODY:}
  token-header: ${ASUTP_TOKEN_HEADER:Authorization}
  token-fields: ${ASUTP_TOKEN_FIELDS:token,data.token}
  tag-list-fields: ${ASUTP_TAG_LIST_FIELDS:data,items,result}
  tag-id-fields: ${ASUTP_TAG_ID_FIELDS:tagId,tg_id,tgId,id}
  tag-value-field: ${ASUTP_TAG_VALUE_FIELD:value}
  data-tag-ids-field: ${ASUTP_DATA_TAG_IDS_FIELD:tagIds}
  # tag-ids отправляются в url_3, а gate-tags/tilt-tags объясняют, какой tagId к какому mixer_id относится.
  tag-ids: ${ASUTP_TAG_IDS:}
  gate-tags: ${ASUTP_GATE_TAGS:}
  tilt-tags: ${ASUTP_TILT_TAGS:}
  gate-open-value: ${ASUTP_GATE_OPEN_VALUE:1}
  tilt-threshold: ${ASUTP_TILT_THRESHOLD:0}
  connect-timeout-millis: ${ASUTP_CONNECT_TIMEOUT_MILLIS:10000}
  read-timeout-millis: ${ASUTP_READ_TIMEOUT_MILLIS:30000}

logging:
  level:
    com.mixer.normalizer: ${LOGGING_LEVEL:INFO}
